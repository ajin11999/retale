# Build the api, console and caddy images and push them to GHCR.
#
# Fires when you push a version tag (e.g. `git tag v2026.06.15 && git push --tags`),
# or manually via the Actions tab (workflow_dispatch). Images are tagged with the
# git tag and `latest`. Operators pull these — no repo clone or local build needed
# (see deploy/DISTRIBUTE.md).
name: Publish images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (defaults to the git ref name)"
        required: false

permissions:
  contents: read
  packages: write # push to GHCR with the built-in GITHUB_TOKEN

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The POS and workshop web bundles are baked into the caddy image, so
      # build them on the runner first (Flutter is not containerized). Needs
      # Dart >= 3.7 (stable). --no-web-resources-cdn bundles CanvasKit locally
      # instead of pulling it from gstatic, so the LAN-only PWAs boot offline
      # without public internet.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Build POS web bundle
        working-directory: packages/pos
        run: flutter build web --no-web-resources-cdn
      - name: Build workshop web bundle
        working-directory: packages/workshop
        run: flutter build web --no-web-resources-cdn

      - name: Resolve image prefix + tag
        id: meta
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"          # GHCR requires lowercase
          echo "prefix=${REGISTRY}/${owner}/retale" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      # Each image builds with context = repo root (the workspace install needs
      # the root lockfile; the caddy image COPYs deploy/ + the POS build above).
      # For ARM targets add `platforms: linux/amd64,linux/arm64` to each.
      - name: Build & push api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/api/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-api:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build & push console
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/console/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-console:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}-console:latest
          cache-from: type=gha,scope=console
          cache-to: type=gha,mode=max,scope=console

      - name: Build & push caddy
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/caddy/Dockerfile
          push: true
          tags: |
            ${{ steps.meta.outputs.prefix }}-caddy:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.prefix }}-caddy:latest
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy
