name: retale_workshop
description: "Retale Workshop — offline workshop-service job sheet that submits a paid sale to the Retale API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # GraphQL client for the Retale API (login, products, sessions, createPosOrder).
  graphql_flutter: ^5.2.0

  # Offline-first local store: jobs + their payment history live here until paid.
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1
  path_provider: ^2.1.5

  # API base URL + selected POS, and secure token storage.
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.2

  # Decode the JWT to read role/exp for the auth gate.
  jwt_decoder: ^2.0.1

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
