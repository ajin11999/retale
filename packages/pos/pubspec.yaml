name: retale_pos
description: "Retale POS — point-of-sale register for the Retale GraphQL API."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # GraphQL client (chosen: graphql_flutter — built-in normalized cache).
  graphql_flutter: ^5.2.0

  # Local config, token storage, and the offline cache + order queue.
  # shared_preferences backs the cache so it works uniformly on web too.
  shared_preferences: ^2.5.2
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.1.0

  # Decode JWT exp claim for proactive token refresh.
  jwt_decoder: ^2.0.1

  # Open WhatsApp (wa.me deep link) to send a receipt. On native we hand off to
  # url_launcher; on web/PWA we click a synthesised <a target="_blank"> via the
  # `web` package, since window.open is silently no-op'd in a standalone PWA.
  url_launcher: ^6.3.0
  web: ^1.1.0

  # Render the receipt to a PDF and open the OS/browser print dialog. Works on
  # Windows/Linux desktop and web alike.
  printing: ^5.13.0
  pdf: ^3.11.0

  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
