type Query {
  """Liveness probe — returns 'ok' when the API is up."""
  health: String!

  """The currently authenticated user, or null if the request is anonymous."""
  me: User

  """Every permission key the server recognises."""
  permissionCatalog: [String!]!

  """All roles, with their permission keys."""
  roles: [Role!]!

  """All users, with their assigned role ids."""
  users: [User!]!
  categories: [Category!]!
  products(search: String, includeArchived: Boolean): [Product!]!
  product(id: ID!): Product
  locations(includeArchived: Boolean): [Location!]!
  location(id: ID!): Location
  variantStock(variantId: ID!): [StockLocation!]!
  variantStockMovements(variantId: ID!, limit: Int): [StockMovement!]!

  """
  Every variant holding stock at a location (locationId null = unlocated root).
  """
  locationStockLevels(locationId: ID): [LocationStockLevel!]!
  vendors(includeArchived: Boolean, kind: VendorKind): [Vendor!]!
  vendor(id: ID!): Vendor
  vendorLedger(vendorId: ID!, limit: Int): [VendorLedgerEntry!]!
  purchases(status: PurchaseStatus, vendorId: ID, includeCancelled: Boolean): [Purchase!]!
  purchase(id: ID!): Purchase

  """
  Render a PO for sending: message body + recipient + wa.me / mailto: deep link.
  """
  purchaseSendDraft(purchaseId: ID!, channel: PurchaseSendChannel!, recipientOverride: String): PurchaseSendDraft!

  """
  Latest unit cost per variant across this vendor's non-cancelled purchases — for prefilling new PO lines.
  """
  vendorLastCosts(vendorId: ID!): [VendorLastCost!]!
  deliveries(status: DeliveryStatus, kind: DeliveryKind): [PurchaseDelivery!]!
  delivery(id: ID!): PurchaseDelivery
  customers(includeArchived: Boolean): [Customer!]!
  customer(id: ID!): Customer
  customerLedger(customerId: ID!, limit: Int): [CustomerLedgerEntry!]!
  customerPrices(customerId: ID!): [CustomerPrice!]!

  """
  Lightweight customer search for the POS register — matches name or phone,
  excludes archived. Gated on order.create_pos so any cashier can attach a
  customer to a sale (the broader customers query needs customer.edit).
  """
  posCustomerSearch(search: String, limit: Int): [Customer!]!
  pointsOfSale(includeArchived: Boolean): [PointOfSale!]!
  pointOfSale(id: ID!): PointOfSale
  posSessions(posId: ID, limit: Int): [PosSession!]!
  posSession(id: ID!): PosSession
  order(id: ID!): Order
  orders(posSessionId: ID, customerId: ID, limit: Int): [Order!]!

  """
  Closed, non-return orders that contain all of the given variants — newest first. Drives the POS return-from-cart picker.
  """
  ordersForReturn(variantIds: [ID!]!, limit: Int): [Order!]!

  """
  Render a customer sale for sending: receipt body + recipient + wa.me / mailto: deep link.
  """
  orderSendDraft(orderId: ID!, channel: OrderSendChannel!, recipientOverride: String): OrderSendDraft!
  trackingAccounts(includeArchived: Boolean): [TrackingAccount!]!
  trackingAccount(id: ID!): TrackingAccount
  trackingAccountLedger(accountId: ID!, limit: Int): [TrackingAccountLedgerEntry!]!

  """
  All non-archived variants, marked with their current tracking-account link if any.
  """
  assignableTrackingVariants: [AssignableTrackingVariant!]!
  stockTransfers(limit: Int): [StockTransfer!]!
  stockTransfer(id: ID!): StockTransfer

  """Reorder forecast for every monitored physical product variant."""
  reorderForecast(windowDays: Int, recentWindowDays: Int, soonHorizonDays: Int): [ReorderForecastRow!]!

  """Reorder suggestions, newest scan first; optionally filtered by status."""
  reorderSuggestions(status: ReorderSuggestionStatus): [ReorderSuggestion!]!

  """Simulate a reorder plan constrained by a specific budget."""
  reorderBudgetSandbox(budgetAmount: Float!): BudgetReorderPlan!

  """
  The open (draft) receiving check for a purchase, or null if none is in progress.
  """
  openReceivingCheck(purchaseId: ID!): PurchaseDelivery

  """
  Every purchase line with ordered / delivered / remaining and completeness.
  """
  receivingCheckLines(purchaseId: ID!): [ReceivingCheckLine!]!

  """
  Resolve a scanned barcode / SKU to the purchase line(s) it counts against.
  """
  resolveReceivingScan(purchaseId: ID!, code: String!): [PurchaseItem!]!

  """Every variant code mapped for a vendor."""
  codesForVendor(vendorId: ID!): [VendorVariantCode!]!

  """Every vendor that has a code mapped for a variant."""
  codesForVariant(variantId: ID!): [VendorVariantCode!]!

  """Catalog publish history, newest first."""
  catalogPublishes(limit: Int): [CatalogPublish!]!

  """
  Purchase alerts, newest first. acknowledged: true / false / omitted (all).
  """
  purchaseAlerts(acknowledged: Boolean): [PurchaseAlert!]!
  productImages(productId: ID!): [ProductImage!]!

  """
  Product alerts, newest first. acknowledged: true / false / omitted (all).
  """
  productAlerts(acknowledged: Boolean): [ProductAlert!]!
  businessSettings: BusinessSettings!

  """
  Business name and phone for a receipt header. Readable by any authenticated
  user (the full businessSettings query is admin-gated), so POS clerks can
  build receipts.
  """
  businessReceiptInfo: BusinessReceiptInfo!
  addresses(includeArchived: Boolean): [Address!]!
  address(id: ID!): Address

  """
  Active addresses for the vendor ship-to picker. Gated on vendor.edit so a clerk can choose one without settings access.
  """
  shipToAddresses: [Address!]!

  """Sales volume — orders, units, revenue, by day."""
  salesReport(periodStart: String!, periodEnd: String!): SalesReport!

  """Cost / margin — revenue vs COGS over the period."""
  profitReport(periodStart: String!, periodEnd: String!): ProfitReport!

  """Customer debt aging as of now."""
  arAgingReport: AgingReport!

  """Vendor debt aging as of now."""
  apAgingReport: AgingReport!

  """Cash-drawer variance for sessions closed in the period."""
  sessionVarianceReport(periodStart: String!, periodEnd: String!): SessionVarianceReport!

  """
  Per-variant units / revenue / cost for one POS session — gross sale price, a quick lookup (unlike the aggregate reports, it does not net attribution).
  """
  sessionVariantSales(sessionId: ID!): [SessionVariantSale!]!

  """Balanced double-entry journal for the period, for external accounting."""
  journalExport(periodStart: String!, periodEnd: String!): JournalExport!
}

type Mutation {
  """Placeholder so domains have a Mutation type to extend."""
  _noop: Boolean

  """Create the first (root) user. Fails once any user exists."""
  bootstrap(username: String!, password: String!, name: String!): AuthPayload!

  """Authenticate with username + password. May return a 2FA challenge."""
  login(username: String!, password: String!): LoginResult!

  """Complete a 2FA login with a TOTP or recovery code."""
  loginTwoFactor(challengeToken: String!, code: String!): AuthPayload!

  """Rotate a refresh token, returning a fresh token pair."""
  refreshToken(refreshToken: String!): AuthPayload!

  """Revoke the session behind a refresh token. Idempotent."""
  logout(refreshToken: String!): Boolean!

  """
  Begin TOTP enrolment for the current user — returns a secret + recovery codes.
  """
  setupTwoFactor: TwoFactorSetup!

  """
  Confirm a pending TOTP setup by entering a current code; activates 2FA.
  """
  confirmTwoFactor(code: String!): Boolean!

  """Disable 2FA for the current user."""
  disableTwoFactor: Boolean!

  """Replace the current user's recovery codes; the old set is invalidated."""
  regenerateRecoveryCodes: [String!]!
  createRole(name: String!, description: String, permissionKeys: [String!]!): Role!

  """Clone a role (typically a template) into a new editable role."""
  cloneRole(roleId: ID!, name: String!): Role!

  """Replace a role's permission set. Template roles are immutable."""
  setRolePermissions(roleId: ID!, permissionKeys: [String!]!): Role!
  deleteRole(roleId: ID!): Boolean!
  createUser(username: String!, password: String!, name: String!, isRoot: Boolean, roleIds: [ID!]): User!
  assignRole(userId: ID!, roleId: ID!): User!
  unassignRole(userId: ID!, roleId: ID!): User!
  createCategory(name: String!, parentId: ID, preferredVariantId: ID, minQty: Int, minMarginBps: Int): Category!
  updateCategory(id: ID!, name: String, parentId: ID, preferredVariantId: ID, minQty: Int, minMarginBps: Int): Category!
  setCategoryArchived(id: ID!, archived: Boolean!): Category!
  deleteCategory(id: ID!): Boolean!
  createProduct(name: String!, publicName: String, description: String, kind: ProductKind, categoryId: ID, taxRateBps: Int, priceMode: PriceMode!, minQty: Int, minMarginBps: Int, costRatioBps: Int, primaryVendorId: ID, replenishMonitored: Boolean, variants: [VariantInput!]!): Product!
  updateProduct(id: ID!, name: String, publicName: String, description: String, kind: ProductKind, categoryId: ID, taxRateBps: Int, priceMode: PriceMode, minQty: Int, minMarginBps: Int, costRatioBps: Int, primaryVendorId: ID, replenishMonitored: Boolean): Product!
  setProductArchived(id: ID!, archived: Boolean!): Product!

  """Hard delete — root-only. Prefer archiving."""
  hardDeleteProduct(id: ID!): Boolean!
  addVariant(productId: ID!, variant: VariantInput!): ProductVariant!
  updateVariant(id: ID!, sku: String, barcode: String, label: String, unit: VariantUnit, qtyDecimals: Int, priceMinor: Float, costMinor: Float, sortOrder: Int): ProductVariant!
  deleteVariant(id: ID!): Boolean!
  setPriceTiers(variantId: ID!, tiers: [PriceTierInput!]!): [PriceTier!]!

  """
  Replace a bundle's components wholesale. The variant's product must be kind='bundle'.
  """
  setBundleComponents(bundleVariantId: ID!, components: [BundleComponentInput!]!): [BundleComponent!]!
  createLocation(name: String!, parentId: ID, code: String, notes: String, sortOrder: Int): Location!
  updateLocation(id: ID!, name: String, parentId: ID, code: String, notes: String, sortOrder: Int): Location!
  setLocationArchived(id: ID!, archived: Boolean!): Location!

  """
  Hard delete — root-only. Refused if the location has children or holds stock.
  """
  hardDeleteLocation(id: ID!): Boolean!

  """
  Manual stock write-on (positive) or write-off (negative). Reason required.
  """
  adjustStock(variantId: ID!, locationId: ID, qtyDelta: Float!, reason: String!): StockMovement!

  """Snap a variant's weighted-average cost to an exact value."""
  overrideVariantCost(variantId: ID!, unitCost: Float!, reason: String): StockMovement!

  """
  Reconcile several variants' on-hand at one location to counted values in one
  transaction (locationId null = unlocated root). Returns the number of lines
  that differed from the current on-hand and were adjusted.
  """
  bulkAdjustStock(locationId: ID, reason: String!, lines: [BulkStockCountInput!]!): Int!
  createVendor(name: String!, kind: VendorKind, phone: String, email: String, address: String, taxId: String, notes: String, leadTimeDays: Int, paymentTermsDays: Int, preferredSendChannel: VendorSendChannel, defaultShipToAddressId: ID): Vendor!
  updateVendor(id: ID!, name: String, kind: VendorKind, phone: String, email: String, address: String, taxId: String, notes: String, leadTimeDays: Int, paymentTermsDays: Int, preferredSendChannel: VendorSendChannel, defaultShipToAddressId: ID): Vendor!
  setVendorArchived(id: ID!, archived: Boolean!): Vendor!

  """
  Hard delete — root-only. Refused if the vendor carries a non-zero AP balance.
  """
  hardDeleteVendor(id: ID!): Boolean!

  """Record a payment to a vendor. amountMinor is the positive sum paid."""
  recordVendorPayment(vendorId: ID!, amountMinor: Float!, posSessionId: ID, note: String): Vendor!

  """
  Root-only manual balance correction. Signed amountMinor; note required.
  """
  adjustVendorBalance(vendorId: ID!, amountMinor: Float!, note: String!): Vendor!
  createPurchase(vendorId: ID, snapshotVendorName: String, date: String!, sourceDocument: String, memo: String, sendDueDate: String): Purchase!
  updatePurchase(id: ID!, vendorId: ID, snapshotVendorName: String, date: String, sourceDocument: String, memo: String, sendDueDate: String): Purchase!
  cancelPurchase(id: ID!): Purchase!

  """Duplicate a purchase as a fresh open draft (recurring-order shortcut)."""
  clonePurchase(id: ID!): Purchase!

  """
  Split unavailable lines of an open PO onto another PO for a different vendor (pre-delivery re-sourcing). The destination is either an existing open PO (targetPurchaseId) or a new one for targetVendorId — exactly one. Trims the source lines; each moved line points at the substitute vendor's variant. Returns the destination PO.
  """
  resourcePurchaseItems(sourcePurchaseId: ID!, targetPurchaseId: ID, targetVendorId: ID, date: String, replacements: [ResourceLineInput!]!): Purchase!
  createPurchaseSection(purchaseId: ID!, name: String!, sortOrder: Int): PurchaseSection!
  updatePurchaseSection(id: ID!, name: String, sortOrder: Int): PurchaseSection!
  deletePurchaseSection(id: ID!): Boolean!
  reorderPurchaseSections(purchaseId: ID!, orderedIds: [ID!]!): [PurchaseSection!]!
  createPurchaseItem(purchaseId: ID!, sectionId: ID, variantId: ID, description: String, qtyOrdered: Float!, unitCostMinor: Float!, sortOrder: Int): PurchaseItem!

  """
  Append several lines at once (bulk-add picker); all-or-nothing, one revision bump.
  """
  createPurchaseItems(purchaseId: ID!, lines: [PurchaseLineInput!]!): [PurchaseItem!]!
  updatePurchaseItem(id: ID!, sectionId: ID, variantId: ID, description: String, qtyOrdered: Float, unitCostMinor: Float, sortOrder: Int): PurchaseItem!
  deletePurchaseItem(id: ID!): Boolean!
  reorderPurchaseItems(purchaseId: ID!, orderedIds: [ID!]!): [PurchaseItem!]!

  """
  Open a send: log a generated PO link. whatsapp/email start 'prepared'; manual is 'sent' at once.
  """
  recordPurchaseSend(purchaseId: ID!, channel: PurchaseSendChannel!, recipient: String!, note: String): PurchaseSend!

  """
  Confirm a prepared send: flip it to 'sent' and capture the expected delivery date.
  """
  confirmPurchaseSend(id: ID!, expectedDeliveryDate: String): PurchaseSend!

  """
  targetLocationId is required for an arrival (the default kind) and must be absent for a transit hop.
  """
  createDelivery(date: String!, biller: String, targetLocationId: ID, kind: DeliveryKind): PurchaseDelivery!
  updateDelivery(id: ID!, date: String, biller: String, targetLocationId: ID): PurchaseDelivery!

  """Discard a draft delivery and its cost tree."""
  deleteDelivery(id: ID!): Boolean!
  createDeliveryItem(
    deliveryId: ID!
    parentItemId: ID
    purchaseItemId: ID

    """Expedition owed for this cost node (freight/customs); cost nodes only."""
    vendorId: ID
    description: String!
    qty: Float
    costMinor: Float!
    sortOrder: Int
  ): PurchaseDeliveryItem!
  updateDeliveryItem(
    id: ID!
    description: String
    qty: Float
    costMinor: Float

    """
    Expedition owed for this cost node; pass null to clear, omit to leave unchanged.
    """
    vendorId: ID

    """
    Reparent: a cost node id to nest under, null for the root, omit to leave unchanged.
    """
    parentItemId: ID
    sortOrder: Int
  ): PurchaseDeliveryItem!
  deleteDeliveryItem(id: ID!): Boolean!

  """
  Commit a draft delivery. Arrival: receives stock, recomputes WAC, advances the PO. Transit: banks freight, raises courier AP only.
  """
  commitDelivery(id: ID!): PurchaseDelivery!

  """
  Reverse a delivered delivery (root only). Arrival: stock returns, WAC not re-valued. Transit: courier AP reversed, pool contribution dropped.
  """
  cancelDelivery(id: ID!): PurchaseDelivery!
  createCustomer(name: String!, phone: String, email: String, address: String, notes: String): Customer!
  updateCustomer(id: ID!, name: String, phone: String, email: String, address: String, notes: String): Customer!
  setCustomerArchived(id: ID!, archived: Boolean!): Customer!

  """Root-only. creditLimitMinor of null clears the limit."""
  setCustomerCreditLimit(id: ID!, creditLimitMinor: Float): Customer!

  """
  Hard delete — root-only. Refused if the customer carries a non-zero AR balance.
  """
  hardDeleteCustomer(id: ID!): Boolean!

  """
  Record a cash payment against existing customer debt. amountMinor is the positive sum received.
  """
  recordDebtPayment(customerId: ID!, amountMinor: Float!, posSessionId: ID, note: String): Customer!

  """
  Root-only manual balance correction. Signed amountMinor; note required.
  """
  adjustCustomerBalance(customerId: ID!, amountMinor: Float!, note: String!): Customer!

  """Upsert a per-customer price override for a variant."""
  setCustomerPrice(customerId: ID!, variantId: ID!, priceMinor: Float!): CustomerPrice!
  removeCustomerPrice(customerId: ID!, variantId: ID!): Boolean!
  createPointOfSale(locationId: ID!, code: String!, name: String!, notes: String): PointOfSale!
  updatePointOfSale(id: ID!, locationId: ID, code: String, name: String, notes: String): PointOfSale!

  """Archive a POS. Refused while a session is open on it."""
  setPointOfSaleArchived(id: ID!, archived: Boolean!): PointOfSale!

  """Hard delete — root-only. Refused while any session references the POS."""
  hardDeletePointOfSale(id: ID!): Boolean!

  """
  Open a cashier shift. Fails if the POS is archived or already has an open session.
  """
  openSession(posId: ID!, openingCashMinor: Float!, notes: String): PosSession!

  """Close a session. Records the cash variance; never blocks on it."""
  closeSession(id: ID!, closingCashMinor: Float!): PosSession!

  """Force-close a stranded session — root-only. Leaves it unreconciled."""
  forceCloseSession(id: ID!): PosSession!

  """Reopen a session to amend mistakes — root-only, within 24h of close."""
  reopenSession(id: ID!): PosSession!

  """
  Create an atomic POS order — closed on create against an open POS session.
  """
  createPosOrder(posSessionId: ID!, customerId: ID, items: [PosOrderItemInput!]!, payments: [PosOrderPaymentInput!]!): Order!

  """Open an empty Console customer sale (stateful, root-only)."""
  createCustomerSale(customerId: ID!, note: String): Order!

  """
  Set or clear the free-text note on an open Console sale. Pass an empty
  string to clear; null leaves it unchanged.
  """
  updateCustomerSaleNote(orderId: ID!, note: String): Order!

  """Add a line to an open Console sale."""
  addCustomerSaleItem(orderId: ID!, item: PosOrderItemInput!): Order!

  """
  Edit a non-voided line on an open Console sale. Each field is optional;
  omitted fields are left untouched. displayNameOverride writes the line's
  receipt name (empty string clears it back to the default).
  """
  updateCustomerSaleItem(orderItemId: ID!, qty: Int, discountMinor: Float, priceOverrideMinor: Float, displayNameOverride: String): Order!

  """
  Void (delete) a line on an open Console sale — returns stock. Reason is optional.
  """
  voidCustomerSaleItem(orderItemId: ID!, reason: String): Order!

  """Record a payment against an open Console sale."""
  addCustomerSalePayment(orderId: ID!, amountMinor: Float!, posSessionId: ID): Order!

  """Close a Console sale — assigns its display number; immutable after."""
  closeCustomerSale(orderId: ID!): Order!

  """Cancel an open Console sale — voids every line. reason is required."""
  cancelCustomerSale(orderId: ID!, reason: String!): Order!

  """Reassign an open Console sale to a different customer (root-only)."""
  changeCustomerSaleCustomer(orderId: ID!, newCustomerId: ID!): Order!

  """
  Create a return order against a closed original. Refund as cash or store credit.
  """
  createReturn(originalOrderId: ID!, posSessionId: ID!, items: [ReturnItemInput!]!, refundMethod: RefundMethod!): Order!
  createTrackingAccount(name: String!, accountCategory: String!, counterCategory: String!, parentId: ID, code: String, notes: String): TrackingAccount!
  updateTrackingAccount(id: ID!, name: String, accountCategory: String, counterCategory: String, parentId: ID, code: String, notes: String): TrackingAccount!
  setTrackingAccountArchived(id: ID!, archived: Boolean!): TrackingAccount!

  """
  Hard delete — root-only. Refused if the account has children or a non-zero balance.
  """
  hardDeleteTrackingAccount(id: ID!): Boolean!

  """
  Pay an account out of the drawer. amountMinor is the positive sum paid.
  """
  recordTrackingPayout(accountId: ID!, amountMinor: Float!, posSessionId: ID, note: String): TrackingAccount!

  """
  Advance cash into an account. amountMinor is the positive sum deposited.
  """
  recordTrackingDeposit(accountId: ID!, amountMinor: Float!, posSessionId: ID, note: String): TrackingAccount!

  """
  Root-only manual balance correction. Signed amountMinor; note required.
  """
  adjustTrackingBalance(accountId: ID!, amountMinor: Float!, note: String!, counterCategoryOverride: String): TrackingAccount!

  """Replace the set of variants whose sales attribute to this account."""
  setTrackingAccountVariants(accountId: ID!, variantIds: [ID!]!): [TrackingLinkedVariant!]!

  """Draft a transfer between two locations. Moves no stock yet."""
  createStockTransfer(sourceLocationId: ID!, targetLocationId: ID!, items: [StockTransferItemInput!]!, notes: String): StockTransfer!

  """Dispatch a draft — debits stock from the source location."""
  dispatchStockTransfer(id: ID!): StockTransfer!

  """Add lines to an existing draft stock transfer."""
  addStockTransferItems(id: ID!, items: [StockTransferItemInput!]!): StockTransfer!

  """Remove a line from an existing draft stock transfer."""
  removeStockTransferItem(id: ID!, itemId: ID!): StockTransfer!

  """Receive an in-transit transfer — credits stock to the target location."""
  receiveStockTransfer(id: ID!): StockTransfer!

  """Cancel a transfer; an in-transit one has its stock returned to source."""
  cancelStockTransfer(id: ID!, reason: String!): StockTransfer!

  """Rescan tracked variants and rebuild the open suggestion set."""
  runReorderScan: [ReorderSuggestion!]!

  """
  Convert selected open suggestions into draft purchases (one per vendor).
  """
  convertReorderSuggestions(lines: [ConvertReorderLineInput!]!): [Purchase!]!

  """
  Append selected open suggestions as lines on an existing purchase; marks them converted.
  """
  addReorderSuggestionsToPurchase(purchaseId: ID!, lines: [AddReorderLineInput!]!): [PurchaseItem!]!

  """Drop a suggestion from the review list without ordering it."""
  dismissReorderSuggestion(id: ID!): ReorderSuggestion!

  """
  Start a receiving check for a purchase, or resume the one already open.
  """
  startReceivingCheck(purchaseId: ID!, targetLocationId: ID!): PurchaseDelivery!

  """Upsert one counted line; qty 0 removes it. Save-as-you-go."""
  setReceivingCheckLine(deliveryId: ID!, purchaseItemId: ID!, qty: Float!): PurchaseDelivery!

  """
  Commit the check: draft → delivered, receiving stock via the delivery commit.
  """
  commitReceivingCheck(deliveryId: ID!): PurchaseDelivery!

  """
  Upsert a vendor's code for a variant. isPreferred true demotes other vendors.
  """
  setVendorVariantCode(vendorId: ID!, variantId: ID!, code: String!, isPreferred: Boolean): VendorVariantCode!
  deleteVendorVariantCode(id: ID!): Boolean!

  """Edit one product's catalog visibility / display modes."""
  setProductCatalogSettings(id: ID!, onlineVisible: Boolean, onlinePriceMode: OnlinePriceMode, onlineStockMode: OnlineStockMode): Product!

  """Bulk show/hide products on the catalog. Returns the number updated."""
  setProductsOnlineVisible(ids: [ID!]!, visible: Boolean!): Int!

  """Build a fresh snapshot and push it to the live catalog."""
  publishCatalog: CatalogPublish!

  """
  Scan sent-but-undelivered POs and raise overdue alerts. Returns the new alerts.
  """
  scanDeliveryOverdue(graceDays: Int): [PurchaseAlert!]!

  """
  Scan draft POs past their send-by date and raise send_due alerts. Returns the new alerts.
  """
  scanSendDue: [PurchaseAlert!]!

  """Acknowledge an alert — a person has seen it."""
  acknowledgePurchaseAlert(id: ID!, resolutionNote: String): PurchaseAlert!
  deleteProductImage(id: ID!): Boolean!

  """Renumber a product's images to the given id order (0-based)."""
  reorderProductImages(productId: ID!, orderedIds: [ID!]!): [ProductImage!]!

  """
  Scan every product's margins and raise new alerts. Returns the new alerts.
  """
  scanProductAlerts: [ProductAlert!]!

  """Acknowledge an alert — a person has seen it."""
  acknowledgeProductAlert(id: ID!, resolutionNote: String): ProductAlert!
  updateBusinessSettings(name: String, phone: String, email: String, poGreeting: String, poFooter: String, receiptGreeting: String, receiptFooter: String): BusinessSettings!

  """Remove the business logo (clears the URL and deletes the stored file)."""
  clearBusinessLogo: BusinessSettings!
  createAddress(label: String!, recipientName: String, phone: String, line: String!, notes: String, isDefault: Boolean): Address!
  updateAddress(id: ID!, label: String, recipientName: String, phone: String, line: String, notes: String, isDefault: Boolean): Address!

  """Promote one address to the single default ship-to."""
  setDefaultAddress(id: ID!): Address!
  setAddressArchived(id: ID!, archived: Boolean!): Address!

  """Hard delete. Vendors pointing here revert to the fallback address."""
  deleteAddress(id: ID!): Boolean!
}

type User {
  id: ID!
  username: String!
  name: String!
  isRoot: Boolean!
  twoFactorEnabled: Boolean!
  archivedAt: String
  createdAt: String!

  """Ids of the roles assigned to this user."""
  roleIds: [String!]!

  """
  Effective permission keys — every key the user's roles grant (or the full catalog, for root).
  """
  permissions: [String!]!
}

"""
Tokens plus the authenticated user, returned by refresh / bootstrap / 2FA login.
"""
type AuthPayload {
  accessToken: String!
  refreshToken: String!

  """ISO-8601 expiry of the refresh token."""
  refreshExpiresAt: String!
  user: User!
}

"""
Result of a password login: tokens directly, or a 2FA challenge to complete.
"""
type LoginResult {
  requiresTwoFactor: Boolean!

  """Set when requiresTwoFactor — pass to loginTwoFactor with a code."""
  challengeToken: String

  """Set when 2FA is not enabled — the login is already complete."""
  auth: AuthPayload
}

"""Returned by setupTwoFactor — the recovery codes are shown only once."""
type TwoFactorSetup {
  otpauthUrl: String!
  secret: String!
  recoveryCodes: [String!]!
}

type Role {
  id: ID!
  name: String!
  description: String
  isTemplate: Boolean!
  archivedAt: String
  permissionKeys: [String!]!
}

enum ProductKind {
