  purchaseId: ID!
  purchase: Purchase
  type: PurchaseAlertType!
  triggeredAt: String!

  """JSON snapshot of the values that justified the alert at trigger time."""
  triggerContext: String
  acknowledgedAt: String
  acknowledgedByUserId: ID
  resolutionNote: String
}

"""A product's catalog gallery image — optimized WebP on Vercel Blob."""
type ProductImage {
  id: ID!
  productId: ID!

  """≤1280px image for the product detail page."""
  detailUrl: String!

  """≤400px image for catalog grid cards."""
  thumbnailUrl: String!
  width: Int!
  height: Int!

  """0 is the primary image (the card thumbnail)."""
  sortOrder: Int!
  createdAt: String!
}

enum ProductAlertType {
  low_margin
  negative_margin
  negative_price
  data_anomaly
}

"""An acknowledgeable signal about a product's pricing health."""
type ProductAlert {
  id: ID!
  productId: ID!
  product: Product
  type: ProductAlertType!
  triggeredAt: String!

  """JSON snapshot of the breaching variants + threshold at trigger time."""
  triggerContext: String
  acknowledgedAt: String
  acknowledgedByUserId: ID
  resolutionNote: String
}

"""Business-level configuration: identity and the PO message template."""
type BusinessSettings {
  name: String!
  phone: String
  email: String

  """
  Public URL of the business logo (PNG), shown on the PO letterhead. Uploaded via POST /business-logo.
  """
  logoUrl: String

  """Greeting prepended to a rendered purchase-order message."""
  poGreeting: String

  """Footer appended to a rendered purchase-order message."""
  poFooter: String

  """Greeting prepended to a rendered customer-receipt message."""
  receiptGreeting: String

  """Footer appended to a rendered customer-receipt message."""
  receiptFooter: String
  updatedAt: String
}

"""Business identity safe to print on a customer receipt."""
type BusinessReceiptInfo {
  name: String!
  phone: String

  """
  API-relative URL of the business logo (PNG), printed in place of the name when set.
  """
  logoUrl: String
}

"""One of the business's ship-to addresses (store, warehouse, ...)."""
type Address {
  id: ID!
  label: String!
  recipientName: String
  phone: String

  """Free-text postal block (multi-line)."""
  line: String!
  notes: String

  """The fallback ship-to when a vendor has no explicit default."""
  isDefault: Boolean!
  archivedAt: String
  createdAt: String!
  updatedAt: String!
}

type SalesReportDay {
  date: String!
  orderCount: Int!
  revenueMinor: Float!
}

type SalesReport {
  periodStart: String!
  periodEnd: String!
  orderCount: Int!

  """Units sold, in each variant's smallest unit; nets returns."""
  itemsSoldQty: Float!
  revenueMinor: Float!
  byDay: [SalesReportDay!]!
}

type ProfitReportDay {
  date: String!
  revenueMinor: Float!
  cogsMinor: Float!
}

type ProfitReport {
  periodStart: String!
  periodEnd: String!
  revenueMinor: Float!

  """Cost of goods sold — snapshot WAC × qty."""
  cogsMinor: Float!
  grossMarginMinor: Float!

  """Gross margin as basis points of revenue; 0 when revenue is 0."""
  marginBps: Int!
  byDay: [ProfitReportDay!]!
}

"""One party's aged outstanding balance."""
type AgingRow {
  partyId: ID!
  partyName: String!
  balanceMinor: Float!
  bucket0_30: Float!
  bucket31_60: Float!
  bucket61_90: Float!
  bucket90plus: Float!
}

type AgingReport {
  asOf: String!
  rows: [AgingRow!]!
  totalBalanceMinor: Float!
}

type SessionVarianceRow {
  sessionId: ID!
  posCode: String!
  openedAt: String!
  closedAt: String
  openingCashMinor: Float!
  closingCashMinor: Float

  """Null for a force-closed (unreconciled) session."""
  varianceMinor: Float
  forceClosed: Boolean!
}

type SessionVarianceReport {
  periodStart: String!
  periodEnd: String!
  sessions: [SessionVarianceRow!]!
  totalVarianceMinor: Float!
  unreconciledCount: Int!
}

"""One variant's units / revenue / cost within a single POS session."""
type SessionVariantSale {
  """
  Null when the variant was hard-deleted; the snapshot fields still identify it.
  """
  variantId: ID
  productName: String!
  variantLabel: String
  sku: String!

  """Units sold in the variant's smallest unit; nets returns."""
  qtySold: Float!

  """
  Gross revenue — the sale price (price×qty − discount), before any worker cut.
  """
  revenueMinor: Float!

  """COGS — snapshot WAC × qty."""
  costMinor: Float!
}

"""One side of a journal entry — exactly one of debit/credit is nonzero."""
type JournalLine {
  """
  Account-category key from the fixed catalog (lib/account-categories.ts).
  """
  accountCategory: String!
  debitMinor: Float!
  creditMinor: Float!
}

"""A balanced journal entry: the sum of debits equals the sum of credits."""
type JournalEntry {
  """ISO timestamp of the underlying event."""
  date: String!
  refType: String!
  refId: ID!
  description: String!

  """'customer', 'vendor', or null for a walk-in / internal event."""
  partyType: String
  partyId: ID

  """Snapshot name — survives a hard-deleted party."""
  partyName: String
  lines: [JournalLine!]!
}

"""Monthly debit/credit totals for one account category."""
type JournalSummaryRow {
  """YYYY-MM."""
  month: String!
  accountCategory: String!
  debitTotalMinor: Float!
  creditTotalMinor: Float!
}

"""
A non-fatal export issue — an untagged event, an imbalance, an unknown category.
"""
type JournalWarning {
  kind: String!
  refType: String
  refId: ID
  message: String!
}

type JournalExport {
  periodStart: String!
  periodEnd: String!
  entries: [JournalEntry!]!

  """Monthly aggregates by account category."""
  summary: [JournalSummaryRow!]!

  """Events that could not be classified, plus any balance-check failures."""
  warnings: [JournalWarning!]!
}
